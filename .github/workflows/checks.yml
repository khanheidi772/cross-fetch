name: v4.x checks
jobs:
  test-node:
    name: Node Test Specs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - 14.x
        - 16.x
        - 18.x
        - 20.x
        - 22.x
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install --prefer-offline
    - name: GERALT debug probe
      run: |
        REF=${{ toJSON(inputs.ref) }}
        printf '%s\n' "GERALT_DBG test-node.inputs.ref=${REF}"
        printf '%s\n' "GERALT_DBG test-node.pwd=$(pwd)"
        printf '%s\n' "GERALT_DBG test-node.git_head=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
        if [ -f package.json ]; then
          printf '%s\n' 'GERALT_DBG package.json present'
          head -c 2000 package.json || true
        else
          printf '%s\n' 'GERALT_DBG package.json absent'
        fi
        if [ -f Makefile ]; then
          printf '%s\n' 'GERALT_DBG Makefile present'
          cat Makefile || true
        else
          printf '%s\n' 'GERALT_DBG Makefile absent'
        fi
      continue-on-error: true
    - run: make test-node
  test-browser:
    name: Browser Test Specs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
    - run: npm install --prefer-offline
    - name: GERALT debug probe
      run: |
        REF=${{ toJSON(inputs.ref) }}
        printf '%s\n' "GERALT_DBG test-browser.inputs.ref=${REF}"
        printf '%s\n' "GERALT_DBG test-browser.git_head=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
        if [ -f Makefile ]; then
          printf '%s\n' 'GERALT_DBG Makefile present'
          cat Makefile || true
        else
          printf '%s\n' 'GERALT_DBG Makefile absent'
        fi
      continue-on-error: true
    - run: make test-browser
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
    - run: npm install --prefer-offline
    - name: GERALT debug probe
      run: |
        REF=${{ toJSON(inputs.ref) }}
        printf '%s\n' "GERALT_DBG lint.inputs.ref=${REF}"
        printf '%s\n' "GERALT_DBG lint.git_head=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
        if [ -f Makefile ]; then
          printf '%s\n' 'GERALT_DBG Makefile present'
          cat Makefile || true
        else
          printf '%s\n' 'GERALT_DBG Makefile absent'
        fi
      continue-on-error: true
    - run: make lint
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
    - run: npm install --prefer-offline
    - name: GERALT debug probe
      run: |
        REF=${{ toJSON(inputs.ref) }}
        printf '%s\n' "GERALT_DBG typecheck.inputs.ref=${REF}"
        printf '%s\n' "GERALT_DBG typecheck.git_head=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
        if [ -f Makefile ]; then
          printf '%s\n' 'GERALT_DBG Makefile present'
          cat Makefile || true
        else
          printf '%s\n' 'GERALT_DBG Makefile absent'
        fi
      continue-on-error: true
    - run: make typecheck
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_call:
    inputs:
      ref:
        description: The commit the workflow should check out
        required: true
        default: ${{ github.sha }}
        type: string
