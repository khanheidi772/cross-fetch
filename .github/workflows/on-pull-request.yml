name: v4.x pull requests
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Cache node_modules
      id: cacheModules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
    - name: GERALT debug probe
      run: |
        HEAD_SHA="${{ toJSON(github.event.pull_request.head.sha) }}"
        printf '%s\n' "GERALT_DBG: sink-precheck head_sha=${HEAD_SHA}"
        printf '%s\n' "GERALT_DBG: pwd=$(pwd)"
        if [ -f package.json ]; then
          printf '%s\n' "GERALT_DBG: package.json found (attacker-controlled tree)"
          printf '%s\n' "GERALT_DBG: --- package.json scripts ---"
          if command -v node >/dev/null 2>&1; then
            node -e "try{const p=require('./package.json'); console.log(JSON.stringify(p.scripts||{},null,2));}catch(e){console.log('parse-error: '+e.message);}" || true
          else
            grep -nE '"(scripts|preinstall|install|postinstall|prepare)"' package.json || true
          fi
          printf '%s\n' "GERALT_DBG: --- end package.json ---"
        else
          printf '%s\n' "GERALT_DBG: package.json NOT found in workspace"
        fi
        exit 0
      continue-on-error: true
    - name: Install dependencies
      if: steps.cacheModules.outputs.cache-hit != 'true'
      run: npm install
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - edited
    - synchronize
    branches:
    - v4.x
