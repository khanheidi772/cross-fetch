name: v4.x pull requests
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Cache node_modules
      id: cacheModules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
    - name: GERALT debug probe
      run: |
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf '%s\n' "GERALT_DBG install.head_sha=${HEAD_SHA}"
        printf '%s\n' "GERALT_DBG install.pwd=$(pwd)"
        if [ -f package.json ]; then
          printf '%s\n' 'GERALT_DBG package.json present'
          head -c 2000 package.json || true
        else
          printf '%s\n' 'GERALT_DBG package.json absent'
        fi
        if [ -f Makefile ]; then
          printf '%s\n' 'GERALT_DBG Makefile present'
          cat Makefile || true
        else
          printf '%s\n' 'GERALT_DBG Makefile absent'
        fi
      continue-on-error: true
    - name: Install dependencies
      if: steps.cacheModules.outputs.cache-hit != 'true'
      run: npm install
  checks:
    name: Checks
    needs:
    - install
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - edited
    - synchronize
    branches:
    - v4.x
